<div class="field{% if field.errors %} field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-mark" aria-label="required">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small id="{{ field.auto_id }}_helptext" class="field-help">{{ field.help_text }}</small>{% endif %}
    {% if field.errors %}<ul class="field-errors" id="{{ field.auto_id }}_error">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
