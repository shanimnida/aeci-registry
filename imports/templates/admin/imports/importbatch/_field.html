{% load unfold %}
<div class="form-field flex flex-col gap-2 mb-4 {% if field.errors %}errors{% endif %}">
    <label for="{{ field.id_for_label }}" class="block font-semibold text-font-important-light dark:text-font-important-dark text-sm">
        {{ field.label }}{% if field.field.required %}<span class="text-red-600 dark:text-red-500"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <div class="text-xs text-base-400 dark:text-base-500">{{ field.help_text|safe }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="text-xs text-red-600 dark:text-red-500">{{ field.errors|striptags }}</div>
    {% endif %}
</div>
