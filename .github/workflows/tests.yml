name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aegis_test
      SECRET_KEY: ci-only-unique-dummy-key-for-isolated-tests-not-a-production-secret-123456789
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      USE_S3_STORAGE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest --ds=aeci.test_settings -q
      - run: python manage.py migrate --noinput
      - name: Install PostgreSQL 18 backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Test a real backup and restore with synthetic data
        env:
          PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump
          PSQL_PATH: /usr/lib/postgresql/18/bin/psql
          RESTORE_CHECK_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aegis_restore_check
        run: |
          python manage.py shell -c "from people.models import Person; Person.objects.create(first_name='Synthetic', last_name='RestoreCheck')"
          python manage.py backup_database
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True) as conn:
              conn.execute('CREATE DATABASE aegis_restore_check')
          PY
          python scripts/verify_backup_restore.py backups/aeci-*.sql.gz
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['RESTORE_CHECK_DATABASE_URL']) as conn:
              assert conn.execute("SELECT count(*) FROM people_person WHERE last_name='RestoreCheck' AND first_name='Synthetic'").fetchone()[0] == 1
          PY
      - run: python manage.py collectstatic --noinput
      - name: Production configuration checks
        env:
          DEBUG: "False"
        run: python manage.py check --deploy --fail-level WARNING
