{% comment %}
Makes native form controls follow the theme.

A <select>'s closed box is styled by CSS, but the popup list it opens is
drawn by the browser itself, which ignores Tailwind classes entirely. On a
dark page that produced a white list with pale grey text -- unreadable, and
reported as such. `color-scheme` is the property that actually reaches it:
it tells the browser which palette to draw native widgets in, and covers
date pickers, scrollbars and the rest of them at the same time.

Included by the screens that carry their own form controls. Unfold's own
widgets already handle this; these are the hand-written ones on AEGIS's
custom pages.
{% endcomment %}
<style>
    select, input[type="search"], input[type="text"], input[type="date"] {
        color-scheme: light;
    }
    .dark select,
    .dark input[type="search"],
    .dark input[type="text"],
    .dark input[type="date"] {
        color-scheme: dark;
    }
    /* Belt and braces for the closed control: `bg-transparent` inherits the
       page, but some browsers still paint an option list from the element's
       own computed colours rather than from color-scheme alone. */
    .dark select option {
        background-color: rgb(24 24 27);
        color: rgb(228 228 231);
    }
</style>
